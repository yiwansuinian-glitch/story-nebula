<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>故事云</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080f;
      --ink: #d8c89a;
      --ink-bright: #fff3c7;
      --muted: rgba(216, 200, 154, 0.66);
      --line: rgba(216, 200, 154, 0.18);
      --glass: rgba(0, 0, 0, 0.58);
      --ember: #d8835f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    }

    body { cursor: auto; }
    button { cursor: pointer; }
    button, input, textarea { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 44%, rgba(216, 200, 154, 0.08), transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(17, 20, 42, 0.8), #07080f 74%);
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      left: clamp(18px, 3vw, 38px);
      right: clamp(18px, 3vw, 38px);
      top: clamp(16px, 2.6vw, 30px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.86);
    }

    .brand h1 {
      margin: 0;
      color: var(--ink-bright);
      font-size: clamp(34px, 5vw, 70px);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: 0;
    }

    .brand p {
      margin: 12px 0 0;
      max-width: 380px;
      color: var(--muted);
      font: 13px/1.8 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 44px;
      color: var(--ink-bright);
      font: 14px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stats strong {
      font: 500 28px/1 Georgia, "Times New Roman", serif;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      pointer-events: auto;
    }

    .tool,
    .primary,
    .ghost {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--glass);
      backdrop-filter: blur(16px);
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .tool {
      min-width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0 14px;
      color: var(--ink-bright);
      font: 13px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .icon-tool {
      width: 42px;
      padding: 0;
      font-size: 18px;
    }

    .tool:hover,
    .ghost:hover {
      border-color: rgba(216, 131, 95, 0.65);
      background: rgba(216, 131, 95, 0.13);
      color: var(--ink-bright);
    }

    button:active { transform: translateY(1px); }

    .speed-control {
      width: 176px;
      height: 42px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--glass);
      backdrop-filter: blur(16px);
      font: 12px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      pointer-events: auto;
    }

    .speed-control input {
      width: 84px;
      accent-color: var(--ember);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 14vh;
      width: min(650px, calc(100vw - 36px));
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.48);
      text-align: center;
      font: 300 13px/1.8 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      text-shadow: 0 0 22px rgba(0, 0, 0, 0.9);
    }

    .footer {
      position: absolute;
      left: clamp(18px, 3vw, 38px);
      right: clamp(18px, 3vw, 38px);
      bottom: clamp(14px, 2.6vw, 26px);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: rgba(216, 200, 154, 0.5);
      font: 12px/1.4 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .keys { display: flex; gap: 7px; align-items: center; }

    .key {
      min-width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(216, 200, 154, 0.18);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.34);
      color: rgba(255, 243, 199, 0.72);
      font-size: 11px;
    }

    .cursor-dot {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 9;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(255, 243, 199, 0.92);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 18px rgba(216, 131, 95, 0.46), inset 0 0 10px rgba(255, 243, 199, 0.2);
      transition: width 140ms ease, height 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .cursor-dot.hot {
      width: 34px;
      height: 34px;
      border-color: var(--ember);
      background: rgba(216, 131, 95, 0.12);
    }

    .connector {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .connector.show { opacity: 1; }
    .connector line {
      stroke: rgba(216, 200, 154, 0.38);
      stroke-width: 1;
      stroke-dasharray: 2 5;
    }

    .star-card {
      position: fixed;
      z-index: 4;
      min-width: 190px;
      max-width: 280px;
      padding: 14px 15px;
      border: 1px solid rgba(216, 200, 154, 0.22);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
      font: 12px/1.6 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .star-card.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .star-card .date {
      color: var(--ember);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .star-card h2 {
      margin: 7px 0 8px;
      color: var(--ink-bright);
      font: 500 22px/1.12 Georgia, "Times New Roman", "Songti SC", serif;
    }

    .star-card p {
      margin: 0;
      color: rgba(255, 247, 232, 0.54);
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 5;
      width: min(390px, 92vw);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(22px);
      box-shadow: -24px 0 80px rgba(0, 0, 0, 0.42);
      transform: translateX(102%);
      transition: transform 260ms ease;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 18px 12px;
      border-bottom: 1px solid rgba(216, 200, 154, 0.12);
    }

    .drawer-head h2 {
      margin: 0;
      color: var(--ink-bright);
      font-size: 18px;
      font-weight: 500;
    }

    .story-list {
      overflow: auto;
      padding: 8px 18px 18px;
      scrollbar-width: thin;
      pointer-events: auto;
    }

    .story-button {
      width: 100%;
      height: auto;
      display: grid;
      gap: 7px;
      padding: 13px 0;
      border: 0;
      border-bottom: 1px solid rgba(216, 200, 154, 0.1);
      border-radius: 0;
      color: var(--ink);
      text-align: left;
      background: transparent;
    }

    .story-button:hover,
    .story-button.active {
      background: linear-gradient(90deg, rgba(216, 131, 95, 0.12), transparent);
    }

    .story-date {
      color: var(--ember);
      font: 12px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .story-title {
      overflow-wrap: anywhere;
      color: var(--ink-bright);
      font-size: 16px;
      font-weight: 500;
    }

    .story-excerpt {
      display: -webkit-box;
      overflow: hidden;
      color: rgba(255, 247, 232, 0.54);
      font: 12px/1.65 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .drawer-foot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(216, 200, 154, 0.12);
      pointer-events: auto;
    }

    .drawer-foot button {
      height: 38px;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.54);
      backdrop-filter: blur(7px);
      transition: opacity 220ms ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .reader,
    .composer {
      width: min(720px, 100%);
      max-height: min(780px, 88vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.74);
      box-shadow: 0 30px 110px rgba(0, 0, 0, 0.54);
      overflow: hidden;
      transform: translateY(14px);
      transition: transform 420ms ease;
    }

    .modal.open .reader,
    .modal.open .composer { transform: translateY(0); }

    .reader-head,
    .composer-head {
      padding: 19px 20px 15px;
      border-bottom: 1px solid rgba(216, 200, 154, 0.12);
    }

    .reader-date {
      color: var(--ember);
      font: 13px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .reader-title,
    .composer-head h2 {
      margin: 8px 0 0;
      color: var(--ink-bright);
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.08;
      font-weight: 500;
    }

    .reader-body {
      overflow: auto;
      padding: 20px;
      color: rgba(255, 247, 232, 0.86);
      white-space: pre-wrap;
      line-height: 1.95;
      font-size: 15px;
      user-select: text;
    }

    .reader-actions,
    .composer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px 20px;
      border-top: 1px solid rgba(216, 200, 154, 0.12);
    }

    .reader-actions button,
    .composer-actions button {
      height: 40px;
      padding: 0 18px;
      min-width: 88px;
    }

    .primary {
      color: #170e08;
      font: 700 14px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #d8c89a, #d8835f);
      box-shadow: 0 16px 44px rgba(216, 131, 95, 0.2);
    }

    .composer-form {
      overflow: auto;
      display: grid;
      gap: 12px;
      padding: 18px 20px;
      font: 13px/1.5 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: rgba(216, 200, 154, 0.42);
      font-size: 12px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 247, 232, 0.65);
      font-size: 13px;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--ember);
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(216, 200, 154, 0.14);
      border-radius: 6px;
      outline: none;
      color: var(--ink-bright);
      background: rgba(255, 255, 255, 0.07);
      cursor: text;
      transition: border-color 160ms ease, background 160ms ease;
    }

    input {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
      padding: 12px;
      line-height: 1.7;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(216, 131, 95, 0.58);
      background: rgba(255, 255, 255, 0.11);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 8;
      transform: translate(-50%, 18px);
      opacity: 0;
      padding: 10px 15px;
      border-radius: 999px;
      color: #170e08;
      text-align: center;
      background: rgba(216, 200, 154, 0.96);
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      font: 13px/1 Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      .topbar { flex-wrap: wrap; }
      .brand p, .footer { display: none; }
      .stats { order: 3; width: 100%; }
      .toolbar { gap: 7px; }
      .speed-control {
        position: fixed;
        right: 14px;
        top: 64px;
        width: 148px;
        height: 38px;
      }
      .speed-control input { width: 62px; }
      .icon-tool { width: 39px; height: 39px; }
      .tool { height: 39px; }
      .hint { bottom: 18px; font-size: 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .cursor-dot { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>

  <div class="overlay">
    <header class="topbar">
      <div class="brand">
        <h1>故事云</h1>
        <p>Story Cloud · 用星系收藏带日期的小说片段。收藏故事会成为更明亮的星。</p>
      </div>
      <div class="stats" aria-live="polite">
        <span><strong id="storyCount">0</strong> 篇故事</span>
        <span><strong id="favoriteCount">0</strong> 个收藏</span>
      </div>
      <nav class="toolbar" aria-label="星云操作">
        <label class="speed-control" title="控制星系自动旋转速度">
          星云速度
          <input id="speedRange" type="range" min="0" max="100" value="16">
        </label>
        <button class="tool" id="addButton" type="button" title="添加故事">＋ 添加故事</button>
        <button class="tool icon-tool" id="listButton" type="button" title="故事时间线">☰</button>
        <button class="tool icon-tool" id="resetView" type="button" title="重置视角">◎</button>
      </nav>
    </header>

    <p class="hint">拖动鼠标环顾星云，WASD 穿行。靠近星体会显示日期，第一次点击锁定故事，第二次点击阅读。</p>
    <footer class="footer">
      <span>yiwansuinian · GitHub Pages · Three.js</span>
      <span class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">Drag</span></span>
    </footer>
  </div>

  <svg class="connector" id="connector" aria-hidden="true">
    <line id="connectorLine" x1="0" y1="0" x2="0" y2="0"></line>
  </svg>

  <button class="star-card" id="starCard" type="button" aria-label="打开故事">
    <div class="date" id="cardDate"></div>
    <h2 id="cardTitle"></h2>
    <p>再次点击星星或这张卡片阅读故事</p>
  </button>

  <div class="cursor-dot" id="cursorDot"></div>

  <aside class="drawer" id="drawer" aria-label="故事时间线">
    <div class="drawer-head">
      <h2>故事时间线</h2>
      <button class="tool icon-tool" id="closeDrawer" type="button" title="关闭">×</button>
    </div>
    <div class="story-list" id="storyList"></div>
    <div class="drawer-foot">
      <button class="ghost" id="latestButton" type="button">最近一章</button>
      <button class="ghost" id="clearButton" type="button">清空临时</button>
    </div>
  </aside>

  <div class="modal" id="readerModal" aria-hidden="true">
    <article class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <header class="reader-head">
        <div class="reader-date" id="readerDate"></div>
        <h2 class="reader-title" id="readerTitle"></h2>
      </header>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-actions">
        <button class="ghost" id="deleteButton" type="button">删除</button>
        <button class="primary" id="closeReader" type="button">关闭</button>
      </div>
    </article>
  </div>

  <div class="modal" id="composerModal" aria-hidden="true">
    <form class="composer" id="storyForm">
      <header class="composer-head">
        <h2>点亮新的星</h2>
      </header>
      <div class="composer-form">
        <div class="form-grid">
          <label>
            日期
            <input id="storyDate" type="date" required>
          </label>
          <label>
            标题
            <input id="storyTitle" type="text" maxlength="36" placeholder="例如：雨夜重逢" required>
          </label>
        </div>
        <label class="check-row">
          <input id="storyFavorite" type="checkbox">
          收藏故事，在星云中显示为更亮的星
        </label>
        <label>
          小说故事
          <textarea id="storyText" maxlength="2600" placeholder="写下这一天的故事。它会被收进一颗新的亮星里。" required></textarea>
        </label>
      </div>
      <div class="composer-actions">
        <button class="ghost" id="sampleButton" type="button">填入示例</button>
        <button class="ghost" id="cancelComposer" type="button">取消</button>
        <button class="primary" type="submit">点亮</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已点亮</div>

  <script>
    window.storyCloudFallback = {
      openComposer() {
        const modal = document.querySelector("#composerModal");
        const date = document.querySelector("#storyDate");
        if (date && !date.value) date.value = new Date().toISOString().slice(0, 10);
        modal?.classList.add("open");
        modal?.setAttribute("aria-hidden", "false");
      },
      closeComposer() {
        const modal = document.querySelector("#composerModal");
        modal?.classList.remove("open");
        modal?.setAttribute("aria-hidden", "true");
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("#addButton")?.addEventListener("click", window.storyCloudFallback.openComposer);
      document.querySelector("#cancelComposer")?.addEventListener("click", window.storyCloudFallback.closeComposer);
      document.querySelector("#composerModal")?.addEventListener("click", (event) => {
        if (event.target.id === "composerModal") window.storyCloudFallback.closeComposer();
      });
    });
  </script>

  <script type="module">
    import * as THREE from "three";

    const sceneHost = document.querySelector("#scene");
    const drawer = document.querySelector("#drawer");
    const storyList = document.querySelector("#storyList");
    const readerModal = document.querySelector("#readerModal");
    const composerModal = document.querySelector("#composerModal");
    const readerDate = document.querySelector("#readerDate");
    const readerTitle = document.querySelector("#readerTitle");
    const readerBody = document.querySelector("#readerBody");
    const storyForm = document.querySelector("#storyForm");
    const storyDate = document.querySelector("#storyDate");
    const storyTitle = document.querySelector("#storyTitle");
    const storyText = document.querySelector("#storyText");
    const storyFavorite = document.querySelector("#storyFavorite");
    const storyCount = document.querySelector("#storyCount");
    const favoriteCount = document.querySelector("#favoriteCount");
    const speedRange = document.querySelector("#speedRange");
    const starCard = document.querySelector("#starCard");
    const cardDate = document.querySelector("#cardDate");
    const cardTitle = document.querySelector("#cardTitle");
    const connector = document.querySelector("#connector");
    const connectorLine = document.querySelector("#connectorLine");
    const cursorDot = document.querySelector("#cursorDot");
    const toast = document.querySelector("#toast");

    const localKey = "story-cloud-local-v3";
    const speedKey = "story-cloud-speed-v3";
    const palette = [0xd8c89a, 0xd8835f, 0xc9b28b, 0xf1dfb2, 0xe1a77f];
    const quality = getQualityProfile();
    const samples = [
      {
        id: "train-terminal",
        date: "2026-02-14",
        title: "列车尽头",
        favorite: true,
        text: "她在末班列车的玻璃上写下他的名字。窗外的城市像被雨洗过的银器，灯光一盏一盏退后。广播说终点站快到了，可她知道真正抵达的地方，是多年以后再次想起这一夜。"
      },
      {
        id: "nebula-awakens",
        date: "2026-07-04",
        title: "星云醒来",
        favorite: true,
        text: "他把一整章故事放进黑夜。文字没有落到纸上，而是散成微亮的星尘，沿着看不见的轨道慢慢旋转。每当有人靠近，那些句子就像认出了读者，重新排列成可以被触摸的光。"
      }
    ];

    const state = {
      stories: [],
      storyObjects: new Map(),
      selectedId: null,
      hoverId: null,
      screenPointer: { x: -9999, y: -9999 },
      keys: new Set(),
      dragging: false,
      dragMoved: 0,
      lastMouse: { x: 0, y: 0 },
      yaw: 0,
      pitch: -0.12,
      speed: Number(localStorage.getItem(speedKey) || 16) / 100
    };

    speedRange.value = String(Math.round(state.speed * 100));

    const renderer = new THREE.WebGLRenderer({ antialias: quality.antialias, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, quality.pixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x07080f, 1);
    sceneHost.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07080f, 0.00042);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 9000);
    camera.position.set(0, 150, 1200);
    camera.rotation.set(state.pitch, state.yaw, 0, "YXZ");

    const galaxy = new THREE.Group();
    const storyLayer = new THREE.Group();
    scene.add(galaxy, storyLayer);

    const tempVector = new THREE.Vector3();
    const clock = new THREE.Clock();

    function getQualityProfile() {
      const coarse = window.matchMedia("(pointer: coarse)").matches;
      const narrow = window.matchMedia("(max-width: 820px)").matches;
      const lowMemory = navigator.deviceMemory && navigator.deviceMemory <= 4;
      const mobile = coarse || narrow || lowMemory;
      return mobile
        ? { mobile: true, antialias: false, pixelRatio: 1.25, disk: 10500, core: 1400, cloud: 900, field: 3200, cloudCount: 2 }
        : { mobile: false, antialias: true, pixelRatio: 1.75, disk: 26000, core: 3600, cloud: 2400, field: 9000, cloudCount: 3 };
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function makeId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function formatDate(value) {
      const parts = String(value || "").split("-");
      return parts.length === 3 ? `${parts[0]}.${parts[1]}.${parts[2]}` : value || "";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function normalizeStory(raw, source = "public") {
      const title = String(raw.title || "").trim();
      const text = String(raw.text || "").trim();
      if (!title || !text) return null;
      return {
        id: raw.id || makeId(),
        source: raw.source || source,
        date: raw.date || today(),
        title,
        text,
        favorite: Boolean(raw.favorite),
        x: Number(raw.x) || 0,
        y: Number(raw.y) || 0,
        z: Number(raw.z) || 0,
        color: raw.color || null
      };
    }

    function loadLocalStories() {
      try {
        return (JSON.parse(localStorage.getItem(localKey)) || [])
          .map((item) => normalizeStory(item, "local"))
          .filter(Boolean);
      } catch {
        return [];
      }
    }

    function saveLocalStories() {
      localStorage.setItem(localKey, JSON.stringify(state.stories.filter((story) => story.source === "local")));
    }

    async function loadStories() {
      let publicStories = [];
      try {
        const response = await fetch(`stories.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("missing stories.json");
        const data = await response.json();
        publicStories = Array.isArray(data) ? data : [];
      } catch {
        publicStories = samples;
      }
      state.stories = [
        ...publicStories.map((item) => normalizeStory(item, "public")).filter(Boolean),
        ...loadLocalStories()
      ];
      placeStories();
      rebuildStories();
      renderTimeline();
      updateStats();
    }

    function makeGalaxy() {
      galaxy.clear();
      galaxy.add(makeSpiralPoints(quality.disk, quality.mobile ? 0.64 : 0.76, quality.mobile ? 1.45 : 1.7));
      galaxy.add(makeCloudPoints(quality.core, 0, 0, 0, 440, 0xd8c89a, quality.mobile ? 0.34 : 0.44, quality.mobile ? 2.8 : 3.4));
      galaxy.add(makeCloudPoints(quality.cloud, -1450, 180, -620, 540, 0xd8835f, quality.mobile ? 0.16 : 0.22, quality.mobile ? 4.1 : 5.2));
      galaxy.add(makeCloudPoints(quality.cloud, 1220, -120, 880, 620, 0xc9b28b, quality.mobile ? 0.15 : 0.2, quality.mobile ? 4.4 : 5.6));
      if (quality.cloudCount > 2) galaxy.add(makeCloudPoints(2200, 420, 320, -1500, 460, 0xf1dfb2, 0.16, 4.8));
      galaxy.add(makeFieldStars(quality.field));
    }

    function makeSpiralPoints(count, opacity, size) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const arm = i % 5;
        const t = Math.random();
        const angle = arm * Math.PI * 0.4 + t * Math.PI * 8.6 + rand(-0.42, 0.42);
        const radius = 120 + Math.pow(t, 0.72) * 2600 + rand(-70, 70);
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = rand(-38, 38) * (1 + t * 2.8);
        positions[i * 3 + 2] = Math.sin(angle) * radius * 0.72;
        color.set(i % 17 === 0 ? 0xd8835f : i % 11 === 0 ? 0xf1dfb2 : 0xc9b28b);
        const b = rand(0.5, 1);
        colors[i * 3] = color.r * b;
        colors[i * 3 + 1] = color.g * b;
        colors[i * 3 + 2] = color.b * b;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      return new THREE.Points(geometry, new THREE.PointsMaterial({
        size, vertexColors: true, transparent: true, opacity, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
    }

    function makeCloudPoints(count, cx, cy, cz, spread, colorValue, opacity, size) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color(colorValue);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = cx + rand(-spread, spread);
        positions[i * 3 + 1] = cy + rand(-spread * 0.38, spread * 0.38);
        positions[i * 3 + 2] = cz + rand(-spread, spread);
        const b = rand(0.35, 1);
        colors[i * 3] = color.r * b;
        colors[i * 3 + 1] = color.g * b;
        colors[i * 3 + 2] = color.b * b;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      return new THREE.Points(geometry, new THREE.PointsMaterial({
        size, vertexColors: true, transparent: true, opacity, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
    }

    function makeFieldStars(count) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color(0xf8ecd1);
      for (let i = 0; i < count; i++) {
        const shell = rand(3300, 7600);
        const theta = rand(0, Math.PI * 2);
        const phi = Math.acos(rand(-1, 1));
        positions[i * 3] = Math.sin(phi) * Math.cos(theta) * shell;
        positions[i * 3 + 1] = Math.cos(phi) * shell * 0.72;
        positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * shell;
        const b = rand(0.28, 0.9);
        colors[i * 3] = color.r * b;
        colors[i * 3 + 1] = color.g * b;
        colors[i * 3 + 2] = color.b * b;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      return new THREE.Points(geometry, new THREE.PointsMaterial({
        size: 1.9, vertexColors: true, transparent: true, opacity: 0.68, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
    }

    function makeStarTexture(colorValue, favorite) {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const context = canvas.getContext("2d");
      const color = new THREE.Color(colorValue);
      const rgb = `${Math.round(color.r * 255)}, ${Math.round(color.g * 255)}, ${Math.round(color.b * 255)}`;
      const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, "rgba(255, 250, 218, 1)");
      gradient.addColorStop(0.1, `rgba(${rgb}, ${favorite ? 0.8 : 0.56})`);
      gradient.addColorStop(0.24, `rgba(${rgb}, ${favorite ? 0.14 : 0.07})`);
      gradient.addColorStop(1, `rgba(${rgb}, 0)`);
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function placeStories() {
      state.stories.forEach((story, index) => {
        if (story.x || story.y || story.z) return;
        const total = Math.max(1, state.stories.length);
        const angle = index / total * Math.PI * 2 + index * 0.68;
        const radius = 460 + index * 110 + rand(-70, 70);
        story.x = Math.cos(angle) * radius;
        story.y = rand(-170, 190);
        story.z = Math.sin(angle) * radius * 0.72;
      });
    }

    function rebuildStories() {
      storyLayer.clear();
      state.storyObjects.clear();
      state.stories.forEach((story, index) => {
        const colorValue = story.color ? Number(story.color) : palette[index % palette.length];
        const material = new THREE.SpriteMaterial({
          map: makeStarTexture(colorValue, story.favorite),
          transparent: true,
          opacity: story.favorite ? 0.92 : 0.64,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        const sprite = new THREE.Sprite(material);
        const scale = story.favorite ? 42 : 24;
        sprite.scale.set(scale, scale, 1);
        sprite.position.set(story.x, story.y, story.z);
        sprite.userData.storyId = story.id;
        sprite.userData.baseScale = scale;
        sprite.userData.favorite = story.favorite;
        storyLayer.add(sprite);
        state.storyObjects.set(story.id, sprite);
      });
    }

    function renderTimeline() {
      state.stories.sort((a, b) => a.date.localeCompare(b.date));
      storyList.innerHTML = "";
      state.stories.forEach((story) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "story-button";
        if (story.id === state.selectedId) button.classList.add("active");

        const date = document.createElement("div");
        date.className = "story-date";
        date.textContent = `${formatDate(story.date)}${story.favorite ? " · 收藏" : ""}`;
        const title = document.createElement("div");
        title.className = "story-title";
        title.textContent = story.title;
        const excerpt = document.createElement("div");
        excerpt.className = "story-excerpt";
        excerpt.textContent = story.text;

        button.append(date, title, excerpt);
        button.addEventListener("click", () => {
          drawer.classList.remove("open");
          selectStory(story.id);
          flyToStory(story.id);
        });
        storyList.append(button);
      });
    }

    function updateStats() {
      storyCount.textContent = String(state.stories.length);
      favoriteCount.textContent = String(state.stories.filter((story) => story.favorite).length);
    }

    function addStory(date, title, text, favorite) {
      const index = state.stories.length;
      const angle = index * 1.82 + rand(-0.4, 0.4);
      const story = normalizeStory({
        id: makeId(),
        source: "local",
        date,
        title,
        text,
        favorite,
        x: Math.cos(angle) * rand(540, 1350),
        y: rand(-210, 260),
        z: Math.sin(angle) * rand(420, 1050)
      }, "local");
      state.stories.push(story);
      saveLocalStories();
      rebuildStories();
      renderTimeline();
      updateStats();
      selectStory(story.id);
      showToast("新的星亮起来了");
    }

    function selectStory(storyId) {
      state.selectedId = storyId;
      const story = state.stories.find((item) => item.id === storyId);
      if (!story) return;
      cardDate.textContent = formatDate(story.date);
      cardTitle.textContent = story.title;
      starCard.classList.add("show");
      updateSelectionOverlay();
      renderTimeline();
    }

    function clearSelection() {
      state.selectedId = null;
      starCard.classList.remove("show");
      connector.classList.remove("show");
      renderTimeline();
    }

    function openStory(storyId) {
      const story = state.stories.find((item) => item.id === storyId);
      if (!story) return;
      state.selectedId = story.id;
      readerDate.textContent = formatDate(story.date);
      readerTitle.textContent = story.title;
      readerBody.textContent = story.text;
      readerModal.classList.add("open");
      readerModal.setAttribute("aria-hidden", "false");
      renderTimeline();
    }

    function closeReader() {
      readerModal.classList.remove("open");
      readerModal.setAttribute("aria-hidden", "true");
    }

    function openComposer() {
      window.storyCloudFallback.openComposer();
      setTimeout(() => storyTitle.focus(), 80);
    }

    function closeComposer() {
      window.storyCloudFallback.closeComposer();
    }

    function getProjected(storyId) {
      const object = state.storyObjects.get(storyId);
      if (!object) return null;
      tempVector.copy(object.position).project(camera);
      return {
        x: (tempVector.x * 0.5 + 0.5) * window.innerWidth,
        y: (-tempVector.y * 0.5 + 0.5) * window.innerHeight,
        visible: tempVector.z > -1 && tempVector.z < 1,
        depth: tempVector.z
      };
    }

    function updateSelectionOverlay() {
      const storyId = state.selectedId || state.hoverId;
      const story = state.stories.find((item) => item.id === storyId);
      if (!story) {
        connector.classList.remove("show");
        return;
      }
      const projected = getProjected(story.id);
      if (!projected?.visible) {
        connector.classList.remove("show");
        return;
      }
      const cardX = Math.min(window.innerWidth - 306, Math.max(18, projected.x + 36));
      const cardY = Math.min(window.innerHeight - 145, Math.max(86, projected.y - 36));
      starCard.style.left = `${cardX}px`;
      starCard.style.top = `${cardY}px`;
      connectorLine.setAttribute("x1", projected.x);
      connectorLine.setAttribute("y1", projected.y);
      connectorLine.setAttribute("x2", cardX + 12);
      connectorLine.setAttribute("y2", cardY + 22);
      connector.classList.add("show");
    }

    function findStoryUnderPointer() {
      const hits = [];
      for (const [storyId] of state.storyObjects.entries()) {
        const projected = getProjected(storyId);
        if (!projected?.visible) continue;
        const dx = state.screenPointer.x - projected.x;
        const dy = state.screenPointer.y - projected.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const story = state.stories.find((item) => item.id === storyId);
        const hitRadius = story?.favorite ? 17 : 11;
        if (distance <= hitRadius) hits.push({ storyId, distance, depth: projected.depth });
      }
      hits.sort((a, b) => a.distance - b.distance || a.depth - b.depth);
      return hits[0]?.storyId || null;
    }

    function flyToStory(storyId) {
      const object = state.storyObjects.get(storyId);
      if (!object) return;
      const target = object.position.clone();
      const direction = target.clone().sub(camera.position).normalize();
      camera.position.copy(target.clone().sub(direction.multiplyScalar(720)));
      camera.lookAt(target);
      const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
      state.yaw = euler.y;
      state.pitch = euler.x;
    }

    function resetView() {
      camera.position.set(0, 150, 1200);
      state.yaw = 0;
      state.pitch = -0.12;
      camera.rotation.set(state.pitch, state.yaw, 0, "YXZ");
      clearSelection();
    }

    function updateCamera(delta) {
      const speed = 520 * delta;
      const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
      const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
      forward.y = 0;
      right.y = 0;
      forward.normalize();
      right.normalize();

      if (state.keys.has("w")) camera.position.addScaledVector(forward, speed);
      if (state.keys.has("s")) camera.position.addScaledVector(forward, -speed);
      if (state.keys.has("a")) camera.position.addScaledVector(right, -speed);
      if (state.keys.has("d")) camera.position.addScaledVector(right, speed);
      if (state.keys.has("q")) camera.position.y -= speed * 0.72;
      if (state.keys.has("e")) camera.position.y += speed * 0.72;

      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -3600, 3600);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, -1400, 1800);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -3600, 4200);
      camera.rotation.set(state.pitch, state.yaw, 0, "YXZ");
    }

    function updateHover() {
      state.hoverId = findStoryUnderPointer();
      cursorDot.classList.toggle("hot", Boolean(state.hoverId));
      if (state.hoverId && !state.selectedId) {
        const story = state.stories.find((item) => item.id === state.hoverId);
        if (story) {
          cardDate.textContent = formatDate(story.date);
          cardTitle.textContent = story.title;
          starCard.classList.add("show");
        }
      } else if (!state.selectedId) {
        starCard.classList.remove("show");
        connector.classList.remove("show");
      }
    }

    function pulseStories(now) {
      for (const [storyId, object] of state.storyObjects.entries()) {
        const active = storyId === state.selectedId;
        const hover = storyId === state.hoverId;
        const base = object.userData.baseScale;
        const pulse = 1 + Math.sin(now * 0.0015 + base) * 0.035;
        const lift = active ? 1.35 : hover ? 1.18 : 1;
        object.scale.setScalar(base * pulse * lift);
        object.material.opacity = object.userData.favorite ? 0.9 : 0.58;
        if (active || hover) object.material.opacity = 1;
      }
    }

    function animate(now) {
      const delta = Math.min(0.04, clock.getDelta());
      galaxy.rotation.y += delta * 0.012 * state.speed;
      galaxy.rotation.z = Math.sin(now * 0.00004) * (quality.mobile ? 0.012 : 0.025);
      storyLayer.rotation.y += delta * 0.012 * state.speed;
      updateCamera(delta);
      updateHover();
      pulseStories(now);
      updateSelectionOverlay();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function showStoryFromPointer() {
      const storyId = findStoryUnderPointer();
      if (!storyId) {
        clearSelection();
        return;
      }
      if (state.selectedId === storyId) openStory(storyId);
      else selectStory(storyId);
    }

    function deleteSelectedLocalStory() {
      if (!state.selectedId) return;
      const story = state.stories.find((item) => item.id === state.selectedId);
      if (story?.source === "public") {
        showToast("公开故事请修改 stories.json");
        return;
      }
      state.stories = state.stories.filter((item) => item.id !== state.selectedId);
      state.selectedId = null;
      saveLocalStories();
      rebuildStories();
      renderTimeline();
      updateStats();
      closeReader();
      showToast("已删除临时故事");
    }

    function bindEvents() {
      document.querySelector("#addButton").addEventListener("click", openComposer);
      document.querySelector("#listButton").addEventListener("click", () => drawer.classList.add("open"));
      document.querySelector("#closeDrawer").addEventListener("click", () => drawer.classList.remove("open"));
      document.querySelector("#resetView").addEventListener("click", resetView);
      document.querySelector("#latestButton").addEventListener("click", () => {
        const latest = [...state.stories].sort((a, b) => a.date.localeCompare(b.date)).at(-1);
        if (!latest) return;
        drawer.classList.remove("open");
        selectStory(latest.id);
        flyToStory(latest.id);
      });
      document.querySelector("#clearButton").addEventListener("click", () => {
        state.stories = state.stories.filter((story) => story.source === "public");
        state.selectedId = null;
        saveLocalStories();
        rebuildStories();
        renderTimeline();
        updateStats();
        drawer.classList.remove("open");
        showToast("已清空本机临时故事");
      });
      document.querySelector("#closeReader").addEventListener("click", closeReader);
      document.querySelector("#cancelComposer").addEventListener("click", closeComposer);
      document.querySelector("#deleteButton").addEventListener("click", deleteSelectedLocalStory);
      document.querySelector("#sampleButton").addEventListener("click", () => {
        const sample = samples[Math.floor(Math.random() * samples.length)];
        storyDate.value = sample.date;
        storyTitle.value = sample.title;
        storyText.value = sample.text;
        storyFavorite.checked = Boolean(sample.favorite);
        showToast("示例已填入");
      });
      storyForm.addEventListener("submit", (event) => {
        event.preventDefault();
        addStory(storyDate.value, storyTitle.value.trim(), storyText.value.trim(), storyFavorite.checked);
        storyTitle.value = "";
        storyText.value = "";
        storyFavorite.checked = false;
        closeComposer();
      });
      starCard.addEventListener("click", () => {
        if (state.selectedId) openStory(state.selectedId);
        else if (state.hoverId) {
          selectStory(state.hoverId);
          openStory(state.hoverId);
        }
      });
      speedRange.addEventListener("input", () => {
        state.speed = Number(speedRange.value) / 100;
        localStorage.setItem(speedKey, String(speedRange.value));
      });
      readerModal.addEventListener("click", (event) => {
        if (event.target === readerModal) closeReader();
      });
      composerModal.addEventListener("click", (event) => {
        if (event.target === composerModal) closeComposer();
      });
      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["w", "a", "s", "d", "q", "e"].includes(key)) {
          state.keys.add(key);
          event.preventDefault();
        }
        if (event.key === "Escape") {
          closeReader();
          closeComposer();
          drawer.classList.remove("open");
          clearSelection();
        }
      });
      window.addEventListener("keyup", (event) => {
        state.keys.delete(event.key.toLowerCase());
      });
      renderer.domElement.addEventListener("pointermove", onPointerMove);
      renderer.domElement.addEventListener("pointerdown", onPointerDown);
      renderer.domElement.addEventListener("pointerup", onPointerUp);
      renderer.domElement.addEventListener("click", () => {
        if (state.dragMoved > 8) return;
        showStoryFromPointer();
      });
    }

    function onPointerMove(event) {
      state.screenPointer.x = event.clientX;
      state.screenPointer.y = event.clientY;
      cursorDot.style.left = `${event.clientX}px`;
      cursorDot.style.top = `${event.clientY}px`;

      if (!state.dragging) return;
      const dx = event.clientX - state.lastMouse.x;
      const dy = event.clientY - state.lastMouse.y;
      state.dragMoved += Math.abs(dx) + Math.abs(dy);
      state.yaw -= dx * 0.0032;
      state.pitch -= dy * 0.0025;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -1.15, 1.05);
      state.lastMouse.x = event.clientX;
      state.lastMouse.y = event.clientY;
    }

    function onPointerDown(event) {
      state.dragging = true;
      state.dragMoved = 0;
      state.lastMouse.x = event.clientX;
      state.lastMouse.y = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    }

    function onPointerUp(event) {
      state.dragging = false;
      renderer.domElement.releasePointerCapture(event.pointerId);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, quality.pixelRatio));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    storyDate.value = today();
    makeGalaxy();
    bindEvents();
    loadStories();
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
