<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>故事星云</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7e8;
      --muted: rgba(255, 247, 232, 0.66);
      --faint: rgba(255, 247, 232, 0.36);
      --line: rgba(255, 247, 232, 0.16);
      --glass: rgba(7, 9, 18, 0.46);
      --glass-strong: rgba(7, 9, 18, 0.78);
      --gold: #ffd878;
      --rose: #ff7fa8;
      --cyan: #8fe7ff;
      --mint: #9cf5cf;
      --violet: #c2adff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: #02030a;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .space {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 216, 120, 0.12), transparent 8%),
        radial-gradient(circle at 68% 32%, rgba(143, 231, 255, 0.15), transparent 18%),
        radial-gradient(circle at 30% 68%, rgba(255, 127, 168, 0.12), transparent 19%),
        radial-gradient(circle at 50% 50%, #17182f 0%, #060816 50%, #010209 100%);
    }

    .space::before {
      content: "";
      position: absolute;
      inset: -20%;
      opacity: 0.35;
      background:
        conic-gradient(from 110deg at 50% 50%, transparent, rgba(255, 216, 120, 0.08), transparent, rgba(143, 231, 255, 0.07), transparent),
        radial-gradient(ellipse at 50% 50%, rgba(255, 247, 232, 0.06), transparent 56%);
      filter: blur(18px);
      animation: breathe 18s ease-in-out infinite alternate;
    }

    .space::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      mix-blend-mode: screen;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.11) 1px, transparent 1px);
      background-size: 64px 64px, 47px 47px;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 76%);
    }

    @keyframes breathe {
      from {
        transform: rotate(-3deg) scale(1);
      }
      to {
        transform: rotate(4deg) scale(1.08);
      }
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .chrome {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .brand {
      position: absolute;
      left: clamp(18px, 3vw, 38px);
      top: clamp(18px, 3vw, 34px);
      width: min(360px, calc(100vw - 36px));
      pointer-events: none;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 78px);
      line-height: 0.92;
      letter-spacing: 0;
      font-weight: 760;
    }

    .brand p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .toolbar {
      position: absolute;
      right: clamp(14px, 2.4vw, 30px);
      top: clamp(14px, 2.4vw, 28px);
      display: flex;
      gap: 9px;
      pointer-events: auto;
    }

    .tool,
    .primary,
    .ghost {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--glass);
      backdrop-filter: blur(18px);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, filter 160ms ease;
    }

    .tool {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      font-size: 19px;
      line-height: 1;
    }

    .tool:hover,
    .ghost:hover {
      border-color: rgba(255, 216, 120, 0.45);
      background: rgba(255, 255, 255, 0.1);
    }

    .primary:hover {
      filter: brightness(1.07);
    }

    button:active {
      transform: translateY(1px);
    }

    .guide {
      position: absolute;
      left: 50%;
      bottom: 22px;
      width: min(560px, calc(100vw - 32px));
      transform: translateX(-50%);
      color: rgba(255, 247, 232, 0.52);
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 4;
      width: min(390px, 92vw);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--line);
      background: rgba(5, 7, 16, 0.78);
      backdrop-filter: blur(22px);
      box-shadow: -24px 0 80px rgba(0, 0, 0, 0.35);
      transform: translateX(102%);
      transition: transform 260ms ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .story-list {
      overflow: auto;
      padding: 8px 18px 18px;
      scrollbar-width: thin;
    }

    .story-button {
      width: 100%;
      height: auto;
      display: grid;
      gap: 7px;
      padding: 13px 0;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      color: var(--ink);
      text-align: left;
      background: transparent;
      cursor: pointer;
    }

    .story-button:hover,
    .story-button.active {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.07), transparent);
    }

    .date {
      color: var(--gold);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .story-title {
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 740;
    }

    .story-excerpt {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .drawer-foot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-foot button {
      height: 38px;
      font-size: 13px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      background: rgba(1, 2, 8, 0.5);
      backdrop-filter: blur(7px);
      transition: opacity 180ms ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .reader,
    .composer {
      width: min(720px, 100%);
      max-height: min(780px, 88vh);
      display: grid;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--glass-strong);
      box-shadow: 0 30px 110px rgba(0, 0, 0, 0.52);
      overflow: hidden;
    }

    .reader {
      grid-template-rows: auto 1fr auto;
    }

    .composer {
      grid-template-rows: auto 1fr auto;
    }

    .reader-head,
    .composer-head {
      padding: 19px 20px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reader-date {
      color: var(--gold);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .reader-title,
    .composer-head h2 {
      margin: 8px 0 0;
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .reader-body {
      overflow: auto;
      padding: 20px;
      color: rgba(255, 247, 232, 0.86);
      white-space: pre-wrap;
      line-height: 1.95;
      font-size: 15px;
    }

    .reader-actions,
    .composer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reader-actions button,
    .composer-actions button {
      height: 40px;
      padding: 0 18px;
      min-width: 88px;
    }

    .primary {
      color: #171007;
      font-weight: 760;
      background: linear-gradient(135deg, var(--gold), var(--rose) 54%, var(--cyan));
      box-shadow: 0 16px 44px rgba(255, 127, 168, 0.22);
    }

    .composer-form {
      overflow: auto;
      display: grid;
      gap: 12px;
      padding: 18px 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--faint);
      font-size: 12px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      transition: border-color 160ms ease, background 160ms ease;
    }

    input {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
      padding: 12px;
      line-height: 1.7;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(255, 216, 120, 0.58);
      background: rgba(255, 255, 255, 0.12);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 7;
      transform: translate(-50%, 18px);
      opacity: 0;
      padding: 10px 15px;
      border-radius: 999px;
      color: #1a1207;
      text-align: center;
      background: rgba(255, 235, 174, 0.96);
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 720px) {
      .brand {
        width: min(260px, calc(100vw - 32px));
      }

      .brand p {
        display: none;
      }

      .toolbar {
        gap: 7px;
      }

      .tool {
        width: 39px;
        height: 39px;
      }

      .guide {
        bottom: 14px;
        font-size: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="space"></div>
  <canvas id="sky" aria-label="故事星云"></canvas>

  <div class="chrome">
    <header class="brand">
      <h1>故事星云</h1>
      <p>每颗亮星都是一段有日期的小说。靠近它，星光会变亮；点击它，故事会展开。</p>
    </header>

    <nav class="toolbar" aria-label="星云操作">
      <button class="tool" id="addButton" type="button" title="添加故事">＋</button>
      <button class="tool" id="listButton" type="button" title="故事时间线">☰</button>
      <button class="tool" id="shuffleButton" type="button" title="重排星云">✧</button>
    </nav>

    <p class="guide">移动鼠标或手指靠近星星，亮点会轻轻回应。点击一颗亮星阅读它。</p>
  </div>

  <aside class="drawer" id="drawer" aria-label="故事时间线">
    <div class="drawer-head">
      <h2>故事时间线</h2>
      <button class="tool" id="closeDrawer" type="button" title="关闭">×</button>
    </div>
    <div class="story-list" id="storyList"></div>
    <div class="drawer-foot">
      <button class="ghost" id="latestButton" type="button">最近一章</button>
      <button class="ghost" id="clearButton" type="button">清空星云</button>
    </div>
  </aside>

  <div class="overlay" id="readerOverlay" aria-hidden="true">
    <article class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <header class="reader-head">
        <div class="reader-date" id="readerDate"></div>
        <h2 class="reader-title" id="readerTitle"></h2>
      </header>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-actions">
        <button class="ghost" id="deleteButton" type="button">删除</button>
        <button class="primary" id="closeReader" type="button">关闭</button>
      </div>
    </article>
  </div>

  <div class="overlay" id="composerOverlay" aria-hidden="true">
    <form class="composer" id="storyForm">
      <header class="composer-head">
        <h2>点亮新的星</h2>
      </header>
      <div class="composer-form">
        <div class="form-grid">
          <label>
            日期
            <input id="storyDate" type="date" required>
          </label>
          <label>
            标题
            <input id="storyTitle" type="text" maxlength="36" placeholder="例如：雨夜重逢" required>
          </label>
        </div>
        <label>
          小说故事
          <textarea id="storyText" maxlength="2600" placeholder="写下这一天的故事。它会被收进一颗新的亮星里。" required></textarea>
        </label>
      </div>
      <div class="composer-actions">
        <button class="ghost" id="sampleButton" type="button">填入示例</button>
        <button class="ghost" id="cancelComposer" type="button">取消</button>
        <button class="primary" type="submit">点亮</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已点亮</div>

  <script>
    const canvas = document.querySelector("#sky");
    const ctx = canvas.getContext("2d");
    const drawer = document.querySelector("#drawer");
    const storyList = document.querySelector("#storyList");
    const readerOverlay = document.querySelector("#readerOverlay");
    const composerOverlay = document.querySelector("#composerOverlay");
    const readerDate = document.querySelector("#readerDate");
    const readerTitle = document.querySelector("#readerTitle");
    const readerBody = document.querySelector("#readerBody");
    const storyForm = document.querySelector("#storyForm");
    const storyDate = document.querySelector("#storyDate");
    const storyTitle = document.querySelector("#storyTitle");
    const storyText = document.querySelector("#storyText");
    const toast = document.querySelector("#toast");

    const storageKey = "story-nebula-shiyun-v1";
    const palette = ["#ffd878", "#ff7fa8", "#8fe7ff", "#9cf5cf", "#c2adff", "#ffd0a8"];
    const samples = [
      {
        date: "2026-02-14",
        title: "列车尽头",
        text: "她在末班列车的玻璃上写下他的名字。窗外的城市像被雨洗过的银器，灯光一盏一盏退后。广播说终点站快到了，可她知道真正抵达的地方，是多年以后再次想起这一夜。"
      },
      {
        date: "2026-04-03",
        title: "潮汐来信",
        text: "海边邮局只在凌晨开门。少年把一封没有地址的信投进蓝色邮箱，信封里夹着一枚贝壳。第二天，潮水退去，沙滩上出现一行字：我也记得那个夏天。"
      },
      {
        date: "2026-06-19",
        title: "月台雪",
        text: "雪落在空无一人的月台上，像许多没有寄出的句子。她撑着黑伞回头，看见远处有个人举起手，动作很轻，却像把整个冬天都重新点亮了。"
      },
      {
        date: "2026-07-04",
        title: "星云醒来",
        text: "他把一整章故事放进黑夜。文字没有落到纸上，而是散成微亮的星尘，沿着看不见的轨道慢慢旋转。每当有人靠近，那些句子就像认出了读者，重新排列成可以被触摸的光。"
      }
    ];

    const state = {
      width: 0,
      height: 0,
      dpr: 1,
      dust: [],
      stories: loadStories(),
      activeId: null,
      hoverId: null,
      pointer: { x: -9999, y: -9999 },
      drift: { x: 0, y: 0 }
    };

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function id() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function loadStories() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey)) || [];
        return saved.map(normalizeStory).filter(Boolean);
      } catch {
        return [];
      }
    }

    function saveStories() {
      localStorage.setItem(storageKey, JSON.stringify(state.stories.slice(-100)));
    }

    function normalizeStory(raw) {
      const title = String(raw.title || "").trim();
      const text = String(raw.text || "").trim();
      if (!title || !text) return null;
      const color = raw.color || palette[Math.floor(Math.random() * palette.length)];
      return {
        id: raw.id || id(),
        date: raw.date || today(),
        title,
        text,
        color,
        x: Number(raw.x) || 0,
        y: Number(raw.y) || 0,
        radius: Number(raw.radius) || rand(68, 112),
        phase: Number(raw.phase) || rand(0, Math.PI * 2),
        spin: Number(raw.spin) || rand(-0.00018, 0.00018),
        words: Array.isArray(raw.words) && raw.words.length ? raw.words.slice(0, 120) : extractWords(title, text),
        born: performance.now()
      };
    }

    function extractWords(title, text) {
      const source = `${title} ${text}`;
      const clean = source.replace(/[，。！？、；：“”‘’（）《》,.!?;:"'()[\]\n\r]/g, " ");
      const chunks = clean.match(/[\u4e00-\u9fff]{1,4}|[a-zA-Z0-9]{2,}/g) || [];
      const words = chunks.map((part) => part.trim()).filter(Boolean);
      if (words.length >= 16) return words.slice(0, 96);
      return [...source].filter((char) => char.trim()).slice(0, 80);
    }

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      seedDust();
      containStories();
    }

    function seedDust() {
      const count = Math.round(Math.min(1100, Math.max(420, state.width * state.height / 1500)));
      state.dust = Array.from({ length: count }, (_, index) => {
        const angle = rand(0, Math.PI * 2);
        const spread = Math.pow(Math.random(), 0.56);
        return {
          index,
          angle,
          spread,
          x: rand(0, state.width),
          y: rand(0, state.height),
          r: rand(0.35, 1.55),
          alpha: rand(0.14, 0.8),
          speed: rand(0.00008, 0.00028),
          phase: rand(0, Math.PI * 2)
        };
      });
    }

    function containStories() {
      const marginX = Math.min(210, Math.max(42, state.width * 0.14));
      const marginY = Math.min(140, Math.max(48, state.height * 0.16));
      state.stories.forEach((story, index) => {
        if (!story.x || !story.y) {
          const total = Math.max(1, state.stories.length);
          const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
          const ringX = Math.max(80, state.width * 0.26);
          const ringY = Math.max(80, state.height * 0.22);
          story.x = state.width * 0.52 + Math.cos(angle) * ringX + rand(-40, 40);
          story.y = state.height * 0.52 + Math.sin(angle) * ringY + rand(-34, 34);
        }
        story.x = Math.min(Math.max(story.x, marginX), Math.max(marginX, state.width - marginX));
        story.y = Math.min(Math.max(story.y, marginY), Math.max(marginY, state.height - marginY));
      });
    }

    function sortStories() {
      state.stories.sort((a, b) => a.date.localeCompare(b.date));
    }

    function formatDate(value) {
      const parts = String(value || "").split("-");
      if (parts.length !== 3) return value || "";
      return `${parts[0]}.${parts[1]}.${parts[2]}`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function renderTimeline() {
      sortStories();
      storyList.innerHTML = "";
      state.stories.forEach((story) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "story-button";
        if (story.id === state.activeId) button.classList.add("active");

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = formatDate(story.date);

        const title = document.createElement("div");
        title.className = "story-title";
        title.textContent = story.title;

        const excerpt = document.createElement("div");
        excerpt.className = "story-excerpt";
        excerpt.textContent = story.text;

        button.append(date, title, excerpt);
        button.addEventListener("click", () => {
          drawer.classList.remove("open");
          openStory(story.id);
        });
        storyList.append(button);
      });
    }

    function addStory(date, title, text) {
      const story = normalizeStory({
        date,
        title,
        text,
        color: palette[Math.floor(Math.random() * palette.length)],
        radius: rand(74, 118),
        phase: rand(0, Math.PI * 2),
        spin: rand(-0.00022, 0.00022)
      });
      state.stories.push(story);
      containStories();
      state.activeId = story.id;
      saveStories();
      renderTimeline();
      showToast("新的星亮起来了");
    }

    function openStory(storyId) {
      const story = state.stories.find((item) => item.id === storyId);
      if (!story) return;
      state.activeId = story.id;
      readerDate.textContent = formatDate(story.date);
      readerTitle.textContent = story.title;
      readerBody.textContent = story.text;
      readerOverlay.classList.add("open");
      readerOverlay.setAttribute("aria-hidden", "false");
      renderTimeline();
    }

    function closeReader() {
      readerOverlay.classList.remove("open");
      readerOverlay.setAttribute("aria-hidden", "true");
    }

    function openComposer() {
      storyDate.value = today();
      composerOverlay.classList.add("open");
      composerOverlay.setAttribute("aria-hidden", "false");
      setTimeout(() => storyTitle.focus(), 80);
    }

    function closeComposer() {
      composerOverlay.classList.remove("open");
      composerOverlay.setAttribute("aria-hidden", "true");
    }

    function drawSpace(now) {
      ctx.clearRect(0, 0, state.width, state.height);

      const cx = state.width * 0.52 + state.drift.x;
      const cy = state.height * 0.51 + state.drift.y;
      const max = Math.max(state.width, state.height);
      const nebula = ctx.createRadialGradient(cx, cy, 0, cx, cy, max * 0.62);
      nebula.addColorStop(0, "rgba(255, 230, 166, 0.18)");
      nebula.addColorStop(0.2, "rgba(143, 231, 255, 0.12)");
      nebula.addColorStop(0.48, "rgba(255, 127, 168, 0.08)");
      nebula.addColorStop(1, "rgba(255, 255, 255, 0)");

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.45 + Math.sin(now * 0.00008) * 0.05);
      ctx.scale(1.7, 0.29);
      ctx.fillStyle = nebula;
      ctx.beginPath();
      ctx.arc(0, 0, max * 0.47, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(now * 0.00003);
      for (const dust of state.dust) {
        const angle = dust.angle + now * dust.speed;
        const band = max * 0.47 * dust.spread;
        const x = Math.cos(angle) * band * 1.45 + Math.sin(dust.phase + now * 0.0006) * 10;
        const y = Math.sin(angle) * band * 0.24 + Math.cos(dust.phase + now * 0.0005) * 7;
        const twinkle = Math.sin(now * 0.003 + dust.phase) * 0.22;
        ctx.globalAlpha = Math.max(0.03, dust.alpha + twinkle);
        ctx.fillStyle = dust.index % 13 === 0 ? "#ffd878" : "#fff7e8";
        ctx.beginPath();
        ctx.arc(x, y, dust.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawConnections() {
      if (state.stories.length < 2) return;
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.lineWidth = 1;
      for (let i = 0; i < state.stories.length - 1; i++) {
        const a = state.stories[i];
        const b = state.stories[i + 1];
        const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        gradient.addColorStop(0, a.color);
        gradient.addColorStop(1, b.color);
        ctx.strokeStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawStory(story, now) {
      const dx = state.pointer.x - story.x;
      const dy = state.pointer.y - story.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const active = state.activeId === story.id;
      const hover = distance < story.radius * 0.95;
      const energy = active ? 1 : hover ? 0.82 : 0;
      const age = Math.min(1, (now - story.born) / 1100);
      const breathe = 1 + Math.sin(now * 0.0018 + story.phase) * 0.08 + energy * 0.2;
      const radius = story.radius * breathe * (0.55 + age * 0.45);

      if (hover) state.hoverId = story.id;

      const glow = ctx.createRadialGradient(story.x, story.y, 0, story.x, story.y, radius * 1.65);
      glow.addColorStop(0, story.color + "d8");
      glow.addColorStop(0.16, story.color + "62");
      glow.addColorStop(0.58, story.color + "12");
      glow.addColorStop(1, story.color + "00");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(story.x, story.y, radius * 1.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(story.x, story.y);
      ctx.rotate(story.phase + now * story.spin);
      ctx.globalCompositeOperation = "lighter";

      for (let i = 0; i < 18; i++) {
        const t = i / 17;
        const angle = t * Math.PI * 2 + now * 0.00035 + story.phase;
        const orbit = 12 + t * radius * 0.56 + Math.sin(now * 0.001 + i) * 2.5;
        const x = Math.cos(angle * (i % 2 ? -1 : 1)) * orbit;
        const y = Math.sin(angle) * orbit * 0.46;
        const alpha = 0.12 + (1 - t) * 0.22 + energy * 0.22 + Math.sin(now * 0.004 + i) * 0.05;
        ctx.globalAlpha = Math.max(0.06, Math.min(0.7, alpha));
        ctx.fillStyle = i % 4 === 0 ? "#fff5cd" : story.color;
        ctx.beginPath();
        ctx.arc(x, y, i % 5 === 0 ? 1.35 : 0.85, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.shadowColor = story.color;
      ctx.shadowBlur = 18 + energy * 22;
      ctx.fillStyle = "#fff5cd";
      ctx.beginPath();
      ctx.arc(0, 0, 4.2 + energy * 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = story.color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.7 + energy * 0.25;
      ctx.beginPath();
      ctx.arc(0, 0, 12 + energy * 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.globalAlpha = 1;
    }

    function animate(now) {
      state.hoverId = null;
      state.drift.x += (state.pointer.x - state.width / 2) * 0.00002 - state.drift.x * 0.02;
      state.drift.y += (state.pointer.y - state.height / 2) * 0.00002 - state.drift.y * 0.02;
      drawSpace(now);
      drawConnections();
      state.stories.forEach((story) => drawStory(story, now));
      requestAnimationFrame(animate);
    }

    function storyAt(x, y) {
      let best = null;
      let bestDistance = Infinity;
      for (const story of state.stories) {
        const dx = x - story.x;
        const dy = y - story.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < story.radius * 0.95 && distance < bestDistance) {
          best = story;
          bestDistance = distance;
        }
      }
      return best;
    }

    document.querySelector("#addButton").addEventListener("click", openComposer);
    document.querySelector("#listButton").addEventListener("click", () => drawer.classList.add("open"));
    document.querySelector("#closeDrawer").addEventListener("click", () => drawer.classList.remove("open"));
    document.querySelector("#shuffleButton").addEventListener("click", () => {
      state.stories.forEach((story) => {
        story.x = 0;
        story.y = 0;
      });
      containStories();
      saveStories();
      showToast("星云已重新排列");
    });

    document.querySelector("#latestButton").addEventListener("click", () => {
      const latest = [...state.stories].sort((a, b) => a.date.localeCompare(b.date)).at(-1);
      if (latest) {
        drawer.classList.remove("open");
        openStory(latest.id);
      }
    });

    document.querySelector("#clearButton").addEventListener("click", () => {
      state.stories = [];
      state.activeId = null;
      saveStories();
      renderTimeline();
      drawer.classList.remove("open");
      showToast("星云已清空");
    });

    document.querySelector("#closeReader").addEventListener("click", closeReader);
    document.querySelector("#cancelComposer").addEventListener("click", closeComposer);

    document.querySelector("#deleteButton").addEventListener("click", () => {
      if (!state.activeId) return;
      state.stories = state.stories.filter((story) => story.id !== state.activeId);
      state.activeId = state.stories.at(-1)?.id || null;
      saveStories();
      renderTimeline();
      closeReader();
      showToast("已删除");
    });

    document.querySelector("#sampleButton").addEventListener("click", () => {
      const sample = samples[Math.floor(Math.random() * samples.length)];
      storyDate.value = sample.date;
      storyTitle.value = sample.title;
      storyText.value = sample.text;
      showToast("示例已填入");
    });

    storyForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addStory(storyDate.value, storyTitle.value.trim(), storyText.value.trim());
      storyTitle.value = "";
      storyText.value = "";
      closeComposer();
    });

    canvas.addEventListener("pointermove", (event) => {
      state.pointer.x = event.clientX;
      state.pointer.y = event.clientY;
    });

    canvas.addEventListener("pointerleave", () => {
      state.pointer.x = -9999;
      state.pointer.y = -9999;
    });

    canvas.addEventListener("click", (event) => {
      const story = storyAt(event.clientX, event.clientY);
      if (story) openStory(story.id);
    });

    readerOverlay.addEventListener("click", (event) => {
      if (event.target === readerOverlay) closeReader();
    });

    composerOverlay.addEventListener("click", (event) => {
      if (event.target === composerOverlay) closeComposer();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeReader();
        closeComposer();
        drawer.classList.remove("open");
      }
    });

    window.addEventListener("resize", resize);

    storyDate.value = today();
    resize();
    if (!state.stories.length) {
      samples.forEach((sample) => {
        state.stories.push(normalizeStory(sample));
      });
      containStories();
      saveStories();
    }
    sortStories();
    state.activeId = state.stories.at(-1)?.id || null;
    renderTimeline();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
